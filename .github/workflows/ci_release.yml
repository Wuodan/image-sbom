name: "CI: Release"

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "CI: Release must run from a v<major>.<minor>.<patch> tag, got: $REF" >&2
            exit 1
          fi

  lint:
    name: Run super-linter
    needs: validate-release-tag
    uses: ./.github/workflows/CI_lint-super-linter.yml
    permissions:
      contents: read

  live-test:
    name: Run live test
    needs: validate-release-tag
    uses: ./.github/workflows/ci_live-test.yml
    permissions:
      contents: read
      id-token: write
      packages: write

  release:
    name: Create GitHub release
    needs:
      - validate-release-tag
      - lint
      - live-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Move short major release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          major_tag="${RELEASE_TAG%%.*}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${major_tag}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major_tag}" \
              -f sha="${TARGET_SHA}" \
              -F force=true
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${major_tag}" \
              -f sha="${TARGET_SHA}"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Publish tools image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          major_tag="${RELEASE_TAG%%.*}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag "${IMAGE}:${RELEASE_TAG}" \
            --tag "${IMAGE}:${major_tag}" \
            .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --verify-tag \
            --generate-notes
