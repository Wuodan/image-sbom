name: Image SBOM
description: Generate an SBOM for a container image and attach it as a Cosign attestation.
author: gh-workflow

branding:
  icon: shield
  color: blue

inputs:
  image:
    description: Image reference to scan and attest, usually image@sha256:digest.
    required: true
  registry-username:
    description: >
      Registry username used by Syft and Cosign for image registry access. Usually github.actor for GHCR images.
    required: false
  registry-password:
    description: >
      Registry password or token used by Syft and Cosign for image registry access.
      Usually secrets.GITHUB_TOKEN for GHCR images.
    required: false
  format:
    description: SBOM format to generate. Supported values are spdx-json and cyclonedx-json.
    required: false
    default: spdx-json

outputs:
  sbom-dir:
    description: Directory containing the generated SBOM files.
    value: ${{ steps.paths.outputs.SBOM_DIR }}

runs:
  using: composite
  steps:
    - name: Prepare paths
      id: paths
      shell: bash
      env:
        FORMAT: ${{ inputs.format }}
      run: |
        set -euo pipefail
        sbom_dir="$(mktemp -d "${RUNNER_TEMP}/image-sbom.XXXXXX")"
        case "${FORMAT}" in
          spdx-json)
            echo "SBOM_DIR=${sbom_dir}" >>"${GITHUB_OUTPUT}"
            echo "SBOM_EXT=spdx.json" >>"${GITHUB_OUTPUT}"
            echo "PREDICATE_TYPE=spdxjson" >>"${GITHUB_OUTPUT}"
            ;;
          cyclonedx-json)
            echo "SBOM_DIR=${sbom_dir}" >>"${GITHUB_OUTPUT}"
            echo "SBOM_EXT=cyclonedx.json" >>"${GITHUB_OUTPUT}"
            echo "PREDICATE_TYPE=cyclonedx" >>"${GITHUB_OUTPUT}"
            ;;
          *)
            echo "::error::Unsupported format '${FORMAT}'. Supported values are: spdx-json, cyclonedx-json."
            exit 1
            ;;
        esac

    - name: Resolve runnable image manifests
      id: resolve
      shell: bash
      env:
        TOOL_IMAGE: ${{ env.IMAGE_SBOM_TOOLS_IMAGE || 'ghcr.io/gh-workflow/image-sbom:v1' }}
        IMAGE: ${{ inputs.image }}
        SBOM_DIR: ${{ steps.paths.outputs.SBOM_DIR }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        docker run --rm --entrypoint /bin/sh \
          -e IMAGE \
          -e SBOM_DIR \
          -e REGISTRY_USERNAME \
          -e REGISTRY_PASSWORD \
          -v "${ACTION_PATH}/scripts:/image-sbom/scripts:ro" \
          -v "${SBOM_DIR}:${SBOM_DIR}" \
          "${TOOL_IMAGE}" \
          /image-sbom/scripts/action/resolve-image-manifests.sh
        echo "RESOLVED_IMAGES_FILE=${SBOM_DIR}/resolved-images.txt" >>"${GITHUB_OUTPUT}"

    - name: Generate and attest SBOM
      id: generate
      shell: bash
      env:
        TOOL_IMAGE: ${{ env.IMAGE_SBOM_TOOLS_IMAGE || 'ghcr.io/gh-workflow/image-sbom:v1' }}
        FORMAT: ${{ inputs.format }}
        PREDICATE_TYPE: ${{ steps.paths.outputs.PREDICATE_TYPE }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        RESOLVED_IMAGES_FILE: ${{ steps.resolve.outputs.RESOLVED_IMAGES_FILE }}
        SBOM_DIR: ${{ steps.paths.outputs.SBOM_DIR }}
        SBOM_EXT: ${{ steps.paths.outputs.SBOM_EXT }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        docker run --rm --entrypoint /bin/sh \
          -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
          -e ACTIONS_ID_TOKEN_REQUEST_URL \
          -e FORMAT \
          -e PREDICATE_TYPE \
          -e REGISTRY_USERNAME \
          -e REGISTRY_PASSWORD \
          -e RESOLVED_IMAGES_FILE \
          -e SBOM_DIR \
          -e SBOM_EXT \
          -e SYFT_CMD=syft \
          -v "${ACTION_PATH}/scripts:/image-sbom/scripts:ro" \
          -v "${SBOM_DIR}:${SBOM_DIR}" \
          "${TOOL_IMAGE}" \
          /image-sbom/scripts/action/generate-attest-sbom.sh
